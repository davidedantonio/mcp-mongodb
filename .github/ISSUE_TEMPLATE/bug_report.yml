name: Bug report
description: Report something that is not working as expected
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a bug. Please fill in as much as you can.
        For security issues, use the private advisory link instead.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug and what you expected instead.
      placeholder: When I query collection X with filter Y, I get ...
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Minimal steps, config snippet, and the query you sent.
      placeholder: |
        1. Config: ...
        2. Query sent: ...
        3. Response / error: ...
      render: text
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: mcp-mongodb version
      placeholder: 0.1.2
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node.js version
      placeholder: "22.x"
    validations:
      required: true
  - type: input
    id: mongodb
    attributes:
      label: MongoDB version
      placeholder: "7.x"
    validations:
      required: false
  - type: input
    id: client
    attributes:
      label: MCP client
      description: e.g. Claude Desktop, custom client, HTTP
      placeholder: Claude Desktop 0.x
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Paste any relevant log output. Redact connection strings and credentials.
      render: shell
    validations:
      required: false
